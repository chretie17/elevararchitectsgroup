[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old WordPress URLs that no longer exist on a static site
[[redirects]]
  from = "/wp-admin/*"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/wp-login.php"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/feed/*"
  to = "/"
  status = 301

[[headers]]
  for = "/wp-content/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/wp-includes/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
